name: Build Guardian Angel APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-guardian-angel-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build signed debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon
      - name: Publish installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guardian-angel-apk-${{ github.run_number }}
          name: Guardian Angel APK ${{ github.run_number }}
          prerelease: false
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
