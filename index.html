<style>
:root{--green:#16834a;--green2:#0f683b;--soft:#e8f6ee;--bg:#f0f2f5;--card:#fff;--text:#17221b;--muted:#68756e;--line:#dce3df;--danger:#c62828;--shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(24,55,38,.06)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:100;height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(10px,calc((100vw - 1380px)/2));gap:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:10px;min-width:235px;flex:0 0 235px}.angel{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:900;font-size:20px}.brandName{font-weight:850;font-size:20px}.brandTag{font-size:11px;color:var(--muted)}
.topSearch{flex:1;max-width:580px}.topSearch input{width:100%;height:42px;border:0;border-radius:22px;background:#eef1f0;padding:0 18px;outline:0}.topActions{margin-left:auto;display:flex;gap:8px}.iconBtn{width:42px;height:42px;border:0;border-radius:50%;background:#edf0f1;color:#27332c;font-weight:800;font-size:18px}.iconBtn:hover{background:var(--soft);color:var(--green)}
.layout{width:min(1380px,100%);margin:auto;display:grid;grid-template-columns:250px minmax(0,680px) 300px;gap:22px;padding:18px 18px 40px;align-items:start}nav{position:sticky;top:82px;min-width:0}.navbtn{width:100%;display:flex;align-items:center;border:0;background:transparent;border-radius:10px;padding:8px 10px;margin:2px 0;min-height:46px;text-align:left;color:#27332c;font-weight:750}.navbtn:hover,.navbtn.active{background:var(--soft);color:var(--green)}.navIcon{width:34px;height:34px;flex:0 0 34px;margin-right:10px;border-radius:50%;display:grid;place-items:center;background:#e8eeea;color:var(--green);font-weight:900}
main,.right{min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-width:0}main>.card,.post{margin-bottom:12px}h1,h2,h3{line-height:1.25;margin:0 0 8px}h1{font-size:24px}h2{font-size:21px}h3{font-size:17px}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.primary{background:var(--green);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:800}.primary:hover{background:var(--green2)}.ghost{background:#edf0f1;color:#27332c;border:0;border-radius:8px;padding:10px 15px;font-weight:750}.pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:#edf1ef;color:#526057;font-size:12px;font-weight:750}
.stories{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{position:relative;min-width:112px;width:112px;height:178px;flex:0 0 112px;border-radius:12px;overflow:hidden;padding:11px;color:#fff;display:flex;align-items:flex-end;font-weight:800;background:linear-gradient(145deg,#126b3e,#4abd80)}.story.add{background:#fff;color:var(--text);border:1px solid var(--line);align-items:center;justify-content:center;text-align:center}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--soft);color:var(--green);font-weight:850}.avatar img{width:100%;height:100%;object-fit:cover}
.composer{margin-top:12px}.composerTop{display:flex;align-items:center;gap:10px}.composer textarea{display:block;flex:1;min-height:50px;max-height:180px;resize:vertical;border:0;border-radius:24px;background:#f0f2f3;padding:12px 16px;outline:0}.composer textarea:focus{box-shadow:inset 0 0 0 2px var(--soft)}.composerTools{display:flex;gap:4px;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}.toolBtn{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 6px;color:#5a675f;font-weight:750}.toolBtn:hover{background:#f2f5f3;color:var(--green)}
.post{padding:0;overflow:hidden}.posthead{display:flex;justify-content:space-between;gap:10px;padding:14px 16px 0}.postbody{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 16px;line-height:1.5;margin:12px 0}.media{display:block;width:100%;max-width:100%;max-height:680px;object-fit:cover}.postStats{display:flex;justify-content:space-between;gap:8px;padding:9px 15px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.actions{display:flex;gap:2px;padding:5px 8px}.actions button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 6px;color:#556259;font-weight:750}.actions button:hover{background:#f2f5f3;color:var(--green)}
.comments{border-top:1px solid var(--line);padding:10px 14px;background:#fafbfa}.comment{display:flex;gap:8px;margin:8px 0}.commentBubble{background:#edf0ef;border-radius:13px;padding:8px 11px;max-width:calc(100% - 50px);overflow-wrap:anywhere}.commentName{font-weight:800;font-size:13px}.commentForm{display:flex;gap:8px;margin-top:8px}.commentForm input{flex:1;min-width:0;border:0;background:#edf0ef;border-radius:20px;padding:9px 13px;outline:0}.commentForm button{border:0;background:var(--green);color:#fff;border-radius:50%;width:38px;height:38px}
.profileCover{height:250px;border-radius:12px 12px 0 0;background:linear-gradient(135deg,#0b5d34,#2eb874 58%,#c4ead4)}.profileHead{padding:0 20px 18px;background:#fff;border-radius:0 0 12px 12px}.profileAvatar{width:132px;height:132px;flex-basis:132px;border:5px solid #fff;margin-top:-66px}.profileName{font-size:29px;font-weight:850;margin-top:7px}.profileTabs{display:flex;gap:3px;border-top:1px solid var(--line);margin-top:16px;padding-top:7px;overflow-x:auto}.profileTabs button{border:0;background:transparent;padding:10px 16px;border-radius:8px;font-weight:750;white-space:nowrap}.profileTabs button:hover{background:#f2f5f3;color:var(--green)}
.featureCard{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff,#f1faf5)}.featureCard:before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-35px;top:-45px;background:var(--soft)}
.featureTitle{font-size:18px;font-weight:850}.featureText{color:var(--muted);font-size:14px}.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;background:#fff;outline:0}.field:focus{border-color:var(--green)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55);z-index:300;overflow:auto}.modal.show{display:flex}.dialog{width:min(500px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:14px;padding:24px}.empty{text-align:center;padding:34px 12px;color:var(--muted)}
@media(max-width:1120px){.layout{grid-template-columns:220px minmax(0,1fr);gap:16px}.right{display:none}}
@media(max-width:760px){
 header{height:58px;padding:0 8px;gap:8px}.brand{min-width:0;flex:1}.brandTag,.topSearch{display:none}.brandName{font-size:18px}.topActions{margin-left:auto}.iconBtn{width:38px;height:38px}
 .layout{display:block;width:100%;padding:0 5px 30px}.layout nav{position:sticky;top:58px;z-index:80;background:#fff;border-bottom:1px solid var(--line);margin:0 -5px 8px;padding:4px;display:flex;overflow-x:auto;box-shadow:0 1px 2px rgba(0,0,0,.04)}.navbtn{width:auto;min-width:max-content;min-height:42px;margin:0;padding:6px 9px}.navIcon{width:27px;height:27px;flex-basis:27px;margin-right:5px}
 .card{border-radius:10px;padding:12px}.stories{margin:0 -1px}.story{min-width:100px;width:100px;height:158px;flex-basis:100px}.composerTop{align-items:flex-start}.composer textarea{min-height:48px}.composerTools .toolBtn{font-size:12px;padding:9px 2px}
 .posthead{padding:12px 13px 0}.postbody{padding:0 13px}.postStats{padding:8px 12px}.actions{padding:4px}.actions button{font-size:12px;padding:9px 3px}.comments{padding:9px 10px}
 .profileCover{height:175px}.profileHead{padding:0 14px 14px}.profileAvatar{width:100px;height:100px;flex-basis:100px;margin-top:-50px}.profileName{font-size:24px}
}
